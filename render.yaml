services:
  - type: web
    name: viji-marimony-deploy-backend
    region: mumbai
    buildCommand: npm install && cd backend && npm install && npx prisma generate
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ===========================================
      # DATABASE BACKUP SETTINGS
      # ===========================================
      # Set these in Render Dashboard for security:
      # - USE_GOOGLE_DRIVE=true
      # - BACKUP_RETENTION_DAYS=7
      # - GOOGLE_DRIVE_CREDENTIALS (from service account JSON)
      - key: USE_GOOGLE_DRIVE
        sync: false
      - key: BACKUP_RETENTION_DAYS
        sync: false
      - key: GOOGLE_DRIVE_CREDENTIALS
        sync: false
