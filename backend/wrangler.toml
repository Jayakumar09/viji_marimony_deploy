name = "viji-matrimony-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"
node_compat = true

[env.production]
name = "viji-matrimony-api-prod"

[[env.production.kv_namespaces]]
binding = "UPLOADS"
id = "your-kv-namespace-id-for-uploads"

[[env.production.d1_databases]]
binding = "DATABASE"
database_name = "viji-matrimony-db"
database_id = "your-d1-database-id"

[vars]
ENVIRONMENT = "production"
API_VERSION = "1.0.0"

[[env.production.secret]]
key = "DATABASE_URL"
value = "postgresql://user:password@host:5432/database?sslmode=require"

[[env.production.secret]]
key = "JWT_SECRET"
value = "your-jwt-secret"

[[env.production.secret]]
key = "CLOUDINARY_API_SECRET"
value = "your-cloudinary-secret"

[[env.production.secret]]
key = "ENCRYPTION_KEY"
value = "your-encryption-key"

[[env.production.secret]]
key = "AWS_SECRET_ACCESS_KEY"
value = "your-aws-secret"

# D1 Database for production (using PostgreSQL via Prisma)
# Note: For Prisma with Cloudflare Workers, we'll use the direct PostgreSQL connection
# D1 is not directly compatible with Prisma, so we use the connection string from secrets
